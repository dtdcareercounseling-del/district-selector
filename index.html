<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select District</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
  color: white;

  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('background.jpg') no-repeat center center;
  background-size: cover;
}

/* Mobile optimization */
@media (max-width: 768px) {
  body {
    background-attachment: scroll;
  }
}

select, button {
    padding: 12px;
    font-size: 18px;
    margin-top: 20px;
    border-radius: 8px;
}

button {
    background: #007bff;
    color: #fff;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}
</style>
</head>

<body>

<h2>Select Your District</h2>

<select id="districtSelect">
    <option value="" selected disabled>-- Choose District --</option>

    <option value="ahilyanagar">Ahilyanagar</option>
    <option value="dharashiv">Dharashiv</option>
    <option value="dhule">Dhule</option>
    <option value="jalgaon">Jalgaon</option>
    <option value="kolhapur">Kolhapur</option>
    <option value="latur">Latur</option>
    <option value="nanded">Nanded</option>
    <option value="nandurbar">Nandurbar</option>
    <option value="nashik">Nashik</option>
    <option value="pune">Pune</option>
    <option value="ratnagiri">Ratnagiri</option>
    <option value="sangli">Sangli</option>
    <option value="satara">Satara</option>
    <option value="sindhudurg">Sindhudurg</option>
    <option value="solapur">Solapur</option>
    <option value="other">Other</option>
</select>

<br>

<button onclick="goToDistrict()">Continue</button>

<script>
function goToDistrict() {
    const district = document.getElementById("districtSelect").value;

    if (!district) {
        alert("Please select a district");
        return;
    }

    // encodeURIComponent = safety best practice
    window.location.href = "district.html?district=" + encodeURIComponent(district);
}
</script>

</body>
</html>
