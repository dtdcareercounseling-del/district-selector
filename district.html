<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Join WhatsApp Group</title>

<style>
:root{
  --accent:#28a745;
  --accent-dark:#1f7e34;
  --max-width:1100px;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#ffffff;
  color:#111;
  display:flex;
  justify-content:center;
}

.wrap{
  width:100%;
  max-width:var(--max-width);
  padding:24px;
  box-sizing:border-box;
  text-align:center;
}

/* Language toggle */
.lang-toggle{
  text-align:right;
  margin-bottom:10px;
}

.lang-toggle button{
  padding:6px 12px;
  margin-left:6px;
  border-radius:6px;
  border:1px solid #ccc;
  background:#f1f1f1;
  cursor:pointer;
  font-size:14px;
}

.lang-toggle button:hover{
  background:#ddd;
}

h1{
  font-size:28px;
  margin-bottom:18px;
}

/* WhatsApp button */
.join-btn{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  padding:14px 28px;
  font-size:18px;
  border-radius:10px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  transition:background .15s ease;
}

.join-btn:hover{
  background:var(--accent-dark);
}

.note{
  margin-top:12px;
  font-size:14px;
  color:#555;
}

/* Image section */
.img-wrap{
  width:100%;
  margin-top:24px;
}

.img-wrap img{
  width:100%;
  height:auto;          /* full image visible */
  display:block;
  border-radius:10px;
  object-fit:contain;   /* NO cropping */
}
</style>
</head>

<body>

<div class="wrap">

  <!-- Language toggle -->
  <div class="lang-toggle">
    <button onclick="setLang('en')">English</button>
    <button onclick="setLang('mr')">मराठी</button>
  </div>

  <!-- District title -->
  <h1 id="title">District</h1>

  <!-- Join button -->
  <a id="joinBtn" class="join-btn" href="#" target="_blank" rel="noopener">
    Join WhatsApp Group
  </a>

  <!-- Note -->
  <div class="note" id="noteText">
    Click the green button to open the WhatsApp group
  </div>

  <!-- Publicity image -->
  <div class="img-wrap">
    <img src="publicity.png" alt="Publicity Image">
  </div>

</div>

<script>
/* ===============================
   LANGUAGE TEXT
================================ */
const text = {
  en: {
    title: "District: ",
    button: "Join WhatsApp Group",
    note: "Click the green button to open the WhatsApp group"
  },
  mr: {
    title: "जिल्हा: ",
    button: "WhatsApp ग्रुप जॉईन करा",
    note: "हिरव्या बटणावर क्लिक करून WhatsApp ग्रुप उघडा"
  }
};

/* ===============================
   WHATSAPP LINKS (lowercase keys)
================================ */
const links = {
  "ahilyanagar": "https://chat.whatsapp.com/BsXZG1SEFOAJTg18hf8XlP",
  "dharashiv": "https://chat.whatsapp.com/K76FnLfOoirIdK386Ycsbv",
  "dhule": "https://chat.whatsapp.com/EGlInaZc3nkLjo9FCQKX1V",
  "jalgaon": "https://chat.whatsapp.com/HfzZUTC6YDS2p1KceILQXN",
  "kolhapur": "https://chat.whatsapp.com/GsLcAHkNIJbGOASPF05kpN",
  "latur": "https://chat.whatsapp.com/GQ4X1Gnuw7jFyjCHfwBVvE",
  "nanded": "https://chat.whatsapp.com/IUSsg4EK21CF79tSJwwyOx",
  "nandurbar": "https://chat.whatsapp.com/JyhcYmqoM9945HCGtQHAgk",
  "nashik": "https://chat.whatsapp.com/Doj8ak2fcQ11sDn7FvaNsB",
  "pune": "https://chat.whatsapp.com/CoLOaJULaRv5IoOlSqeGxv",
  "ratnagiri": "https://chat.whatsapp.com/He1JEuNuunZ308xZy57Q1C",
  "sangli": "https://chat.whatsapp.com/DVIpBOqPdKREotpMrO2smr",
  "satara": "https://chat.whatsapp.com/GLi4D0Zjj7RIf33pmhhOy3",
  "sindhudurg": "https://chat.whatsapp.com/Ct8jyVcn763AcxX0ZSgzPv",
  "solapur": "https://chat.whatsapp.com/DVIpBOqPdKREotpMrO2smr",
  "other": "https://chat.whatsapp.com/IBSS9vnAEotG2tUnwTybBA"
};

/* ===============================
   READ DISTRICT FROM URL
================================ */
const params = new URLSearchParams(window.location.search);
const district = (params.get("district") || "").toLowerCase();

const titleEl = document.getElementById("title");
const joinBtn = document.getElementById("joinBtn");
const noteEl = document.getElementById("noteText");

/* ===============================
   APPLY DISTRICT
================================ */
if (links[district]) {
  joinBtn.href = links[district];
} else {
  titleEl.innerText = "District Not Available";
  joinBtn.style.display = "none";
  alert("WhatsApp group link not configured for this district.");
}

/* ===============================
   LANGUAGE SWITCH
================================ */
function setLang(lang){
  localStorage.setItem("lang", lang);
  titleEl.innerText =
    text[lang].title +
    district.charAt(0).toUpperCase() + district.slice(1);
  joinBtn.innerText = text[lang].button;
  noteEl.innerText = text[lang].note;
}

/* Load saved language (default Marathi) */
const savedLang = localStorage.getItem("lang") || "mr";
setLang(savedLang);
</script>

</body>
</html>
