<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay Connected</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  background:#fff;
  max-width:420px;
  width:92%;
  padding:24px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
}

h1{
  font-size:22px;
  margin-bottom:10px;
}

p{
  font-size:14px;
  color:#555;
  margin-bottom:20px;
}

.social a{
  display:block;
  text-decoration:none;
  margin:12px 0;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
}

.telegram{ background:#229ED9; color:#fff; }
.instagram{ background:#E1306C; color:#fff; }
.youtube{ background:#FF0000; color:#fff; }

.social a:hover{
  opacity:0.9;
}

.skip{
  margin-top:12px;
  font-size:13px;
}

.skip a{
  color:#777;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">
  <h1>Stay Connected 🎯</h1>
  <p>
    For regular CET updates, guidance & notifications,  
    follow us on below platforms.
  </p>

  <div class="social">
    <!-- Replace links below -->
    <a class="telegram" href="https://t.me/YOUR_TELEGRAM_LINK" target="_blank">
      📢 Join Telegram Channel
    </a>

    <a class="instagram" href="https://instagram.com/YOUR_INSTAGRAM" target="_blank">
      📸 Follow on Instagram
    </a>

    <a class="youtube" href="https://youtube.com/YOUR_YOUTUBE" target="_blank">
      ▶ Subscribe on YouTube
    </a>
  </div>

  <div class="skip">
    <a href="#">Skip for now</a>
  </div>
</div>

</body>
</html>
